name: Static performance audit

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "assets/**"
      - "scripts/audit-static-assets.py"
      - "scripts/build-web-images.py"
      - "edgeone.json"
      - "package.json"
      - "tests/**"
      - ".github/workflows/static-performance-audit.yml"

  pull_request:
    branches:
      - main
    paths:
      - "*.html"
      - "assets/**"
      - "scripts/audit-static-assets.py"
      - "scripts/build-web-images.py"
      - "edgeone.json"
      - "package.json"
      - "tests/**"
      - ".github/workflows/static-performance-audit.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Check static assets and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit static assets
        run: python3 scripts/audit-static-assets.py

      - name: Test timetable converter
        run: npm test
