name: Vendor local PDF.js

on:
  push:
    branches: [main]
    paths:
      - package.json
      - scripts/vendor-pdfjs.mjs
      - .github/workflows/vendor-pdfjs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-local-pdfjs
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned PDF.js package
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund --package-lock=false

      - name: Copy browser runtime into the site
        run: npm run vendor:pdfjs

      - name: Verify committed PDF.js files
        run: |
          if git diff --quiet -- assets/pdfjs; then
            echo "Local PDF.js files are already up to date."
          else
            git diff --stat -- assets/pdfjs
            echo "::error::Committed PDF.js files are out of date. Run npm run vendor:pdfjs locally and include assets/pdfjs in the pull request."
            exit 1
          fi
